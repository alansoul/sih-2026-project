name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  main:
    name: Lint, Test & Build (Nx Affected)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history needed for Nx affected calculation

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      - name: Initialize Nx SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Lint Affected Projects
        run: pnpm exec nx affected -t lint --parallel=3

      - name: Test Affected Projects
        run: pnpm exec nx affected -t test --parallel=3 --ci --code-coverage

      - name: Build Affected Projects
        run: pnpm exec nx affected -t build --parallel=3